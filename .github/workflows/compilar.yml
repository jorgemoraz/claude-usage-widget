name: Compilar
on:
  push:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -O main.swift -o ClaudeUsage
      - run: bash -n instalar.sh
      - name: Prueba de tamaño
        run: |
          defaults write ClaudeUsage zoom -float 1 || true
          (WIDGET_SELFTEST=1 ./ClaudeUsage > test.log 2>&1 &) ; sleep 12; cat test.log; pkill ClaudeUsage || true
