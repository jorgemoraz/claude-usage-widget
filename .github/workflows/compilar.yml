name: Compilar
on:
  push:
    paths-ignore: ["android/**", "windows/**", ".github/workflows/android.yml", ".github/workflows/windows.yml", ".github/workflows/mantener-clave.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -O main.swift -o ClaudeUsage
      - run: bash -n instalar.sh
      - name: Prueba de tamaño
        run: |
          defaults write ClaudeUsage zoom -float 1 || true
          (WIDGET_SELFTEST=1 ./ClaudeUsage > test.log 2>&1 &) ; sleep 12; cat test.log; pkill ClaudeUsage || true
      - name: Capturas de los formatos
        run: |
          (WIDGET_SELFTEST=1 WIDGET_SHOTS="$PWD/capturas" WIDGET_SPRITES="$PWD/sprites" ./ClaudeUsage > shots.log 2>&1 &) ; sleep 15; cat shots.log; pkill ClaudeUsage || true
          ls -la capturas || true
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
          if-no-files-found: warn
