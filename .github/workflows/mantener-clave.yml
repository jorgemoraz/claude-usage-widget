name: Mantener clave de firma
# GitHub borra las cachés que no se usan en 7 días; esto la toca cada semana para que no caduque
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: android/signing
          key: android-signing-key-v2
          fail-on-cache-miss: true
