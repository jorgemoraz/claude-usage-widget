name: Android capturas
on:
  push:
    paths: ["android/**", ".github/workflows/android-capturas.yml"]
  workflow_dispatch:
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w info.jorgemora.claudeusage.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p shots && adb pull /sdcard/Android/data/info.jorgemora.claudeusage/files/shots/. shots/ || true
            ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-android, path: "shots\ninstrument.txt" }
